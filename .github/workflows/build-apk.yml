name: Build launcher APK

on:
  workflow_dispatch:
  push:
    branches: [any-install]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        env:
          DEPS_REPO: ${{ secrets.DEPS_REPO }}
          DEPS_TOKEN: ${{ secrets.DEPS_TOKEN }}
        run: |
          if [ -z "$DEPS_REPO" ] || [ -z "$DEPS_TOKEN" ]; then
            echo "::error::Add repo secrets DEPS_REPO (owner/private-repo) and DEPS_TOKEN (PAT with read access to it)."
            exit 1
          fi

      # Layout must match the csproj HintPath: ../../SMAPI-Android-1.6/src/DependenciesDll relative to SMAPIGameLoader/
      - uses: actions/checkout@v4
        with:
          path: SMAPILoader

      # PRIVATE repo that holds src/DependenciesDll/{MonoGame.Framework,StardewValley,StardewValley.GameData}.dll
      # extracted from your own game APK. Never put those files in a public repo.
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.DEPS_REPO }}
          token: ${{ secrets.DEPS_TOKEN }}
          path: SMAPI-Android-1.6

      - name: Verify game DLLs are present
        run: |
          for f in MonoGame.Framework StardewValley StardewValley.GameData; do
            test -f "SMAPI-Android-1.6/src/DependenciesDll/$f.dll" || { echo "::error::missing $f.dll in DEPS_REPO at src/DependenciesDll/"; exit 1; }
          done

      # Pixelify Sans, SIL Open Font License 1.1. Pinned to one google/fonts commit and checked by hash.
      # It is only used for large titles. Its licence text is bundled next to it.
      - name: Fetch fonts
        run: |
          set -e
          DIR="SMAPILoader/SMAPIGameLoader/Assets/fonts"
          BASE="https://raw.githubusercontent.com/google/fonts/aa235c2ef8d678e6f1d4797d1514fccfbe160c18/ofl/pixelifysans"
          mkdir -p "$DIR"
          curl -fsSL -o "$DIR/PixelifySans.ttf" "$BASE/PixelifySans%5Bwght%5D.ttf"
          curl -fsSL -o "$DIR/PixelifySans-OFL.txt" "$BASE/OFL.txt"
          echo "9ba86cd010a4de309d263ceff8e8044092c9db7efda869620cb9ff1c4389e8a5  $DIR/PixelifySans.ttf" | sha256sum -c -
          echo "b66ba46f511a851ab09998b5a5a9fdbb102545a3864cb993095e1745996873a7  $DIR/PixelifySans-OFL.txt" | sha256sum -c -

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: SMAPILoader/global.json

      # Must run inside SMAPILoader so global.json pins the same SDK (and workload band) the build uses.
      - name: Install Android workload
        working-directory: SMAPILoader
        run: |
          dotnet --version
          dotnet workload install android
          dotnet workload list

      - name: Restore (downloads runtime packs)
        working-directory: SMAPILoader
        run: dotnet restore SMAPIGameLoader/SMAPIGameLoader.csproj

      - name: Install custom Mono runtime (reflection patches)
        run: |
          set -e
          CUSTOM="$GITHUB_WORKSPACE/SMAPILoader/SharedLibs/native/arm64-v8a/libmonosgen-2.0.so"
          test -f "$CUSTOM"
          mapfile -t TARGETS < <(sudo find / -type f -name libmonosgen-2.0.so -path '*Microsoft.NETCore.App.Runtime.Mono.android-arm64*' 2>/dev/null)
          [ ${#TARGETS[@]} -gt 0 ] || { echo "::error::android-arm64 Mono runtime pack not found"; exit 1; }
          for t in "${TARGETS[@]}"; do
            echo "Replacing $t"
            sudo cp "$t" "$t.stock.bak"
            sudo cp "$CUSTOM" "$t"
          done

      - name: Build
        working-directory: SMAPILoader
        run: |
          dotnet build SMAPIGameLoader/SMAPIGameLoader.csproj -c Release \
            -p:AndroidSdkDirectory="$ANDROID_HOME" \
            -p:JavaSdkDirectory="$JAVA_HOME"

      - uses: actions/upload-artifact@v4
        with:
          name: smapi-launcher-any-install
          path: SMAPILoader/SMAPIGameLoader/bin/Release/net9.0-android/*-Signed.apk
          if-no-files-found: error
